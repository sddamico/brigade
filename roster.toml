# The built-in roster: a catalog of the agents brigade knows, and the accounts
# that offer them by default. A user roster at ~/.config/brigade/roster.toml (or
# $XDG_CONFIG_HOME/brigade/roster.toml) is laid over it: its [[catalog]]
# entries and [[account]]s replace these by name and add the rest.
#
# [[catalog]]   an agent: its model id in each harness that has it, the efforts
#               it takes there where fewer than the harness's, and what it's
#               best for
# [[account]]   credentials runs draw on and share usage limits with: the
#               harness its catalog agents run in, which catalog agents it
#               offers, agents of its own ([[account.agent]]), max_runs, and
#               env/args for every run on it ($VAR and ${VAR} expand)
#
# An agent more than one account offers has a route through each, and a run
# takes the first route with capacity, in account order.
#
# Each catalog agent's benchmark is its model's score on a source below, by key,
# at the effort named: the index, what one of its tasks cost in US dollars, and
# how long one took. They're there to compare agents when picking one for a
# task; refresh them from the source now and then. An account whose server
# switches models (`models_url`) takes the loaded model's entry from the user
# roster's [[served_model]] tables instead.
#
# A user roster can also declare harnesses of its own in [[harness]] tables
# (see the README), and have a [fallbacks] table, `sol = "opus"`, naming the
# agent a run switches to when every route of its agent is limited.

[benchmark_sources.aa]
name = "Artificial Analysis Intelligence Index v5.0.2"
url = "https://artificialanalysis.ai/leaderboards/models"
read = "2026-11-27"

[[catalog]]
name = "fable"
description = "Claude Fable"
best_for = "the most ambitious, open-ended technical work"
benchmark = { source = "aa", intelligence = 65, cost_per_task = 26.54, minutes_per_task = 40.4, effort = "max" }
models = { claude = "fable" }

[[catalog]]
name = "opus"
description = "Claude Opus"
best_for = "agentic coding, computer use and knowledge work; Anthropic's daily driver"
benchmark = { source = "aa", intelligence = 59, cost_per_task = 10.04, minutes_per_task = 24.7, effort = "max" }
models = { claude = "opus", agy = "claude-opus-5-5" }
efforts = { agy = ["low", "medium", "high"] }

[[catalog]]
name = "sonnet"
description = "Claude Sonnet"
best_for = "well-scoped everyday tasks, bug fixes and documents"
benchmark = { source = "aa", intelligence = 55, cost_per_task = 10.02, minutes_per_task = 31.1, effort = "max" }
models = { claude = "sonnet", agy = "claude-sonnet-5-5" }
efforts = { agy = ["low", "medium", "high"] }

[[catalog]]
name = "haiku"
description = "Claude Haiku"
best_for = "high-volume, cheap tasks: summaries, classification, subagent work"
benchmark = { source = "aa", intelligence = 37, cost_per_task = 0.41, minutes_per_task = 15.4, effort = "max" }
models = { claude = "haiku" }

[[catalog]]
name = "sol"
description = "GPT-6.2 Sol"
