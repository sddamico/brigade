# The built-in roster. A user roster at ~/.config/brigade/roster.toml (or
# $XDG_CONFIG_HOME/brigade/roster.toml) adds agents, or replaces these by name.
#
# harness:  the CLI the agent runs in: claude, codex or agy
# model:    passed to that CLI's --model (agy takes the family; effort picks the tier)
# effort:   optional; without it, and without --effort on the call, the harness's
#           own default effort applies
# env/args: extra environment and CLI arguments; values expand $VAR and ${VAR}
#
# A user roster can also have a [fallbacks] table, `sol = "opus"`, naming the
# agent a run switches to when its agent hits a usage limit. The built-in roster
# has none, since which accounts a user has is theirs to say.

[[agent]]
name = "opus"
harness = "claude"
model = "opus"
description = "Claude Opus in Claude Code"

[[agent]]
name = "fable"
harness = "claude"
model = "fable"
description = "Claude Fable in Claude Code"

[[agent]]
name = "sonnet"
harness = "claude"
model = "sonnet"
description = "Claude Sonnet in Claude Code"

[[agent]]
name = "sol"
harness = "codex"
model = "gpt-6.2-sol"
description = "GPT-6.2 Sol in Codex, OpenAI's go-to model for coding and everyday work"

[[agent]]
name = "astra"
harness = "codex"
model = "gpt-6.2-astra"
description = "GPT-6.2 Astra in Codex, OpenAI's most capable model for complex coding"

[[agent]]
name = "neon"
harness = "agy"
model = "gemini-4-neon"
description = "Gemini 4 Neon in Antigravity"

[[agent]]
name = "hydrogen"
harness = "agy"
model = "gemini-4-hydrogen"
description = "Gemini 4 Hydrogen in Antigravity"
