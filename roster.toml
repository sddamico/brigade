best_for = "frontier-level work, balancing depth and speed; strong on legal and finance"
benchmark = { source = "aa", intelligence = 62, cost_per_task = 6.44, minutes_per_task = 26.2, effort = "xhigh" }
models = { agy = "gemini-4-neon" }

[[catalog]]
name = "hydrogen"
description = "Gemini 4 Hydrogen"
best_for = "fast, cheap execution of agent workflows"
benchmark = { source = "aa", intelligence = 54, cost_per_task = 3.16, minutes_per_task = 14.3, effort = "xhigh" }
models = { agy = "gemini-4-hydrogen" }

[[catalog]]
name = "carbon"
description = "Gemini 4 Carbon"
best_for = "the hardest long-horizon work, and security"
benchmark = { source = "aa", intelligence = 60, cost_per_task = 7.76, minutes_per_task = 41.3, effort = "high" }
models = { agy = "gemini-4-carbon" }
efforts = { agy = ["low", "medium", "high"] }

[[catalog]]
name = "argon"
description = "Gemini 4 Argon"
best_for = "real-world coding, enterprise knowledge work and cyber defense"
benchmark = { source = "aa", intelligence = 51, cost_per_task = 7.06, minutes_per_task = 24.8, effort = "high" }
models = { agy = "gemini-4-argon" }
