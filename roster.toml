[[catalog]]
name = "astra"
description = "GPT-6.2 Astra"
best_for = "the hardest projects and scientific work"
benchmark = { source = "aa", intelligence = 62, cost_per_task = 4.00, minutes_per_task = 16.8, effort = "max" }
models = { codex = "gpt-6.2-astra" }

[[catalog]]
name = "terra"
description = "GPT-6.1 Terra"
best_for = "routine work at low cost"
benchmark = { source = "aa", intelligence = 51, cost_per_task = 0.96, minutes_per_task = 16.3, effort = "max" }
